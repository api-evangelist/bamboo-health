aid: bamboo-health
name: Bamboo Health
description: >-
  Bamboo Health (formerly Appriss Health + PatientPing) is a healthcare technology
  company delivering Real-Time Care Intelligence across the physical and behavioral
  health continuum. It operates one of the nation's largest care-collaboration
  networks, connecting health systems, health plans, pharmacies, and state agencies
  through prescription drug monitoring (PDMP), care coordination, and behavioral
  healthcare navigation. Flagship solutions include Bamboo Bridge, OpenBeds, Pings,
  NarxCare, and the PMP AWARxE state monitoring platform. Backed by Insight Partners,
  the company supports over a billion patient encounters annually. Bamboo Health
  does not publish a public developer API; integrations are delivered through EHR
  workflows and partner/state programs. Security posture is documented in a public
  Trust Center (SOC 2 Type II, HITRUST CSF, HIPAA, NIST 800-53).
